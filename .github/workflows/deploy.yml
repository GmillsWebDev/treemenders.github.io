# Build the static site and deploy it to Eco Web Hosting over FTPS.
#
#   push to release/**  -> staging     (staging.treemendersarb.co.uk, password-protected, noindex)
#   push to main        -> production  (treemendersarb.co.uk)
#   pull request        -> build + check only, no deploy
#
# Setup (DirectAdmin FTP accounts, GitHub environments and secrets): see DEPLOYMENT.md.

name: Build and deploy

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # Every service in services.js should have been prerendered
      - name: Check all service pages were built
        run: |
          expected=$(grep -cE "^\s*slug:" src/lib/scripts/services.js)
          built=$(find build/services -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "services.js: $expected, built: $built"
          test "$expected" -eq "$built"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: app/build/
          include-hidden-files: true # .htaccess
          retention-days: 7

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: build
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || startsWith(github.ref_name, 'release/'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.SITE_URL }}
    # One deploy per environment at a time; queue rather than cancel a half-finished upload
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build/

      # Staging gets its own .htaccess (password + noindex, no HSTS/canonical redirect) and a
      # robots.txt that blocks everything, so it can't be indexed or browsed by the public.
      - name: Swap in staging server files
        if: github.ref_name != 'main'
        env:
          AUTH_USER_FILE: ${{ vars.STAGING_AUTH_USER_FILE }}
        run: |
          test -n "$AUTH_USER_FILE" || { echo "::error::Set the STAGING_AUTH_USER_FILE variable on the staging environment (see DEPLOYMENT.md)"; exit 1; }
          sed "s#__AUTH_USER_FILE__#${AUTH_USER_FILE}#" deploy/staging/.htaccess > build/.htaccess
          cp deploy/staging/robots.txt build/robots.txt

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./build/
          # FTP accounts are locked to the site folder, so upload to the account's root
          server-dir: ./

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          IS_STAGING: ${{ github.ref_name != 'main' }}
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$SITE_URL$1")
            echo "$1 -> $code (want $2)"
            test "$code" = "$2"
          }
          if [ "$IS_STAGING" = "true" ]; then
            # No credentials in CI: a 401 proves the site is up and the password is working
            check / 401
          else
            check / 200
            check /services/tree-felling/ 200
            check /sitemap.xml 200
            check /this-page-does-not-exist/ 404
          fi
