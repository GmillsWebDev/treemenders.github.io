<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<!-- SEO Meta info (page titles & descriptions are set per page in <svelte:head>) -->
		<meta name="author" content="Treemenders">
		<meta name="robots" content="index, follow">

		<!-- Favicon -->
		<link rel="icon" href="/favicon/favicon.ico" sizes="any">
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
		<link rel="manifest" href="/favicon/site.webmanifest">
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Fonts are self-hosted (imported in +layout.svelte). Analytics load only after cookie consent ($lib/consent.js). -->
		<!-- Font awesome -->
		<script src="https://kit.fontawesome.com/2bd12e053c.js" crossorigin="anonymous" defer></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
